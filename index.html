<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Form Example</title>
</head>
<body>

    <h1>HTML Form Example</h1>

    <p>
        This is an example of an <del>HTML4</del> <u>HTML5</u> form containing يحتوي various <mark>input</mark> controls:
    </p>

    <form action="#" method="post">

        <fieldset>
            <legend>User Information</legend>
            <label for="username">Username: </label>
            <input type="text" id="username" name="username"><br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email"><br><br>

            <label for="password">Password: </label>
            <input type="password" id="password" name="password">
        </fieldset>
        <br>

        <fieldset>
            <legend>Contact Information</legend>
            <label for="phone">Phone: </label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="message">Message: </label><br>
            <textarea id="message" name="message" rows="4" cols="40"></textarea>
        </fieldset>
        <br>


        <fieldset>
            <legend>Subscription</legend>
            <label for="sub1">Subscribe to newsletter: </label>
            <input type="checkbox" id="sub1" name="sub1"><br><br>

            <label for="sub2">Subscribe to newsletter: </label>
            <input type="checkbox" id="sub2" name="sub2">
        </fieldset>
        <br>

     
        <fieldset>
            <legend>Preferred Language</legend>
            <label for="language">Select your preferred language: </label>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
        </fieldset>
        <br>

        <fieldset>
            <legend>Feedback</legend>
            <label for="rate">Rate our service: </label>
            <input type="range" id="rate" name="rate" min="1" max="5">
        </fieldset>
        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
